image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/nationbuilder.png
name: NationBuilder
description: >-
  NationBuilder is a community-engagement and organizing platform for political
  campaigns, advocacy groups, nonprofits, and membership organizations, pairing a
  supporter CRM with a website/page builder, email and text messaging, event and
  petition tools, and integrated fundraising. Its developer surface is a REST API
  offered in two flavors: the current v2 API, which follows the JSON:API
  specification and authenticates with OAuth 2.0 (authorization-code with optional
  PKCE and refresh tokens), and a legacy v1 API that uses per-nation API tokens.
  The API exposes people/signups, donations, events, petitions, memberships,
  lists, tags, and related resources so integrators can sync supporter data and
  automate outreach. NationBuilder is multi-tenant: each nation is reached at its
  own {nation-slug}.nationbuilder.com host.
