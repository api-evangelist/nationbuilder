  description: >-
    Currently we allow you to record existing donation transactions via API V2. These transactions will
    not be backed by any kind of financial transaction.

    See the [docs](https://support.nationbuilder.com/en/articles/2344242-create-or-record-an-individual-donation)
    for more information.


    If associated with an existing signup, the first_name, middle_name, and last_name associated with
    the donation will be updated on the signup as well.

    If the email is different than the primary email existing on the signup, it will be added to the signup's
    email2, email3, or email4 instead.
