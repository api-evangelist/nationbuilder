- aid: nationbuilder:nationbuilder-suggestions-api
  name: NationBuilder Suggestions API
  description: >-
    Suggestions are individual ideas or proposals submitted to suggestion boxes on your site.

    They can be responded to, categorized, and managed by administrators.


    **Responding to Suggestions:**

    Responses consist of optional text `official_response` and/or status via `response_type_id`. You can
    provide just text, just status, or both combined to officially respond to a suggestion.


    **Response Options:**

    - `official_response` - Text response (optional)

    - `response_type_id` - Status update (optional)

    - `response_author_id` - Signup ID of person that provided the response (optional)

    - `responded_at` - When the response was provided (optional)


    **Response Type IDs:

    - `0` - Not Planned

    - `1` - Considering

    - `2` - Planned

    - `3` - Started

    - `4` - Completed

    - `5` - Incomplete

    - `6` - Duplicate

    - `7` - Submitted (default)
  humanURL: https://support.nationbuilder.com/en/collections/10408291-api
  baseURL: https://{nation-slug}.nationbuilder.com/api/v2
  tags:
  - Suggestions
