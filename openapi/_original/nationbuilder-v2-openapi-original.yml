              schema:
                "$ref": "#/components/schemas/error_response"
        '401':
          "$ref": "#/components/responses/unauthorized"
        '422':
          "$ref": "#/components/responses/unprocessable"
        '429':
          "$ref": "#/components/responses/rate_limited"
      requestBody:
