  "/api/v2/lists/{id}/add_signups":
    parameters:
      - "$ref": "#/components/parameters/id"
    patch:
      summary: Add signups
      tags:
        - Lists
      description: |
        Add Signup IDs to list via an asynchronous process.
        Returns the token of an asynchronous process that can be queried using another endpoint.
        Accepts up to 10,000 signup IDs in a single payload.
      operationId: addSignups
      responses:
        '202':
          description: A token for tracking the asynchronous add-signups process.
          headers:
            RateLimit-Limit:
              "$ref": "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              "$ref": "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              "$ref": "#/components/headers/RateLimit-Reset"
          content:
            application/vnd.api+json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    examples:
                      - '1234'
        '400':
          description: The add-signups request exceeded the maximum of 10,000 signup IDs.
          headers:
            RateLimit-Limit:
              "$ref": "#/components/headers/RateLimit-Limit"
            RateLimit-Remaining:
              "$ref": "#/components/headers/RateLimit-Remaining"
            RateLimit-Reset:
              "$ref": "#/components/headers/RateLimit-Reset"
          content:
            application/json:
              example:
                code: bad_request
                message: A maximum of 10000 signup ids are allowed
              schema:
                "$ref": "#/components/schemas/error_response"
        '401':
          "$ref": "#/components/responses/unauthorized"
        '404':
          "$ref": "#/components/responses/not_found"
        '429':
          "$ref": "#/components/responses/rate_limited"
      requestBody:
        description: The signups to add to the list.
        content:
          application/vnd.api+json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    id:
                      type: string
                      description: The ID of the list to add signups to.
                      examples:
                        - '1'
                    type:
                      type: string
                      const: lists
                      description: Resource type. Must always be lists.
                      examples:
                        - lists
                    signup_ids:
                      type: array
                      description: IDs of the signups to add to custom list.
                      examples:
                        - - '1'
                          - '2'
                  required:
                    - id
                    - type
                    - signup_ids
          application/json:
            schema:
              type: object
              properties:
                data:
                  type: object
                  properties:
                    id:
                      type: string
                      description: The ID of the list to add signups to.
                      examples:
                        - '1'
                    type:
                      type: string
                      const: lists
                      description: Resource type. Must always be lists.
                      examples:
                        - lists
                    signup_ids:
                      type: array
                      description: IDs of the signups to add to custom list.
                      examples:
                        - - '1'
                          - '2'
                  required:
                    - id
                    - type
                    - signup_ids
        required: true
