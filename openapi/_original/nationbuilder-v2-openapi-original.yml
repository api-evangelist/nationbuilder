  headers:
    RateLimit-Limit:
      description: Maximum number of requests allowed for the current access token per rate-limit window (10 seconds).
      schema:
        type: string
        examples:
          - '250'
      examples: {}
    RateLimit-Remaining:
      description: Number of requests remaining for the current access token in the current rate-limit window.
      schema:
        type: string
        examples:
          - '249'
      examples: {}
    RateLimit-Reset:
      description: Unix timestamp (in seconds) at which the current rate-limit window resets.
      schema:
        type: string
        examples:
          - '1719964810'
      examples: {}
    Retry-After:
      description: Number of seconds to wait before retrying. Sent with 429 responses.
      schema:
        type: string
        examples:
          - '10'
      examples: {}
tags:
  - name: Async Processes
    x-tag-expanded: false
    description: This endpoint is used to get information about deferred or asynchronous processes returned by other endpoints such as adding and removing signups from a list or tagging and untagging signups from a list. Other endpoints in the future may use a deferred model as well.
  - name: Automation Enrollments
    x-tag-expanded: false
    description: AutomationEnrollments link signups to automations. Every AutomationEnrollment belongs to a single Signup and a single Automation. Further information on how signups are enrolled in automations is available [here](https://support.nationbuilder.com/en/articles/6680735-create-an-automation#h_2783ee4e5c).
  - name: Automations
    x-tag-expanded: false
    description: Automations represent workflows where chains of actions and reactions can be created within a nation. Signups can be enrolled in an automation and are represented via the AutomationEnrollments resource. Further information available [here](https://support.nationbuilder.com/en/articles/6680735-create-an-automation).
  - name: Ballots
    x-tag-expanded: false
    description: Ballots are a record of an election and how a person voted for said election. Each ballot is associated with a voter and an election and contains information such as when the ballot was cast, the party, and vote method. Further information about vote history and ballots available [here](https://support.nationbuilder.com/en/articles/2471330-import-vote-history).
  - name: Broadcasters
    x-tag-expanded: false
    description: Broadcasters are the voices who speak publicly on behalf of your nation. All external communications are organized around broadcasters.
  - name: Contacts
    x-tag-expanded: false
    description: |
      Contacts are logged interactions between people in your nation. More information about contacts and the fields found in the
      UI and API interfaces can be found [here](https://support.nationbuilder.com/en/articles/2306309-logging-contacts).
  - name: Custom Fields
    x-tag-expanded: false
    description: Custom fields are available for Signups and Donations. See [here](https://support.nationbuilder.com/en/articles/2340612-introduction-to-custom-fields) for more information.
  - name: Donation Tracking Codes
    x-tag-expanded: false
    description: Tracking codes are used to identify where a financial transaction came from. Users give the tracking code a custom name/slug and use the code to track where a donation was made. Read more about them [here](https://support.nationbuilder.com/en/articles/2344337-understanding-tracking-codes).
  - name: Donations
    x-tag-expanded: false
    description: |
      Currently we allow you to record existing donation transactions via API V2. These transactions will not be backed by any kind of financial transaction.
      See the [docs](https://support.nationbuilder.com/en/articles/2344242-create-or-record-an-individual-donation) for more information.

      If associated with an existing signup, the first_name, middle_name, and last_name associated with the donation will be updated on the signup as well.
      If the email is different than the primary email existing on the signup, it will be added to the signup's email2, email3, or email4 instead.
  - name: Elections
    x-tag-expanded: false
    description: Elections are available on nations with voter features enabled. See more information about election functionality [here](https://support.nationbuilder.com/en/articles/2362732-set-up-your-election)
  - name: Event Rsvps
    x-tag-expanded: false
    description: This resource is for creating, reading, updating, and deleting Event RSVPs. When creating event RSVPs, the rsvp must be given signup data, either by passing a first name, last name, and email or phone number, or by sideposting a signup.
  - name: Event Ticket Levels
    x-tag-expanded: false
    description: This resource is for creating, reading, updating, and deleting ticket levels for events. manage the ticket levels available for the events. Ticket levels and their prices are displayed on public events. More information on ticketed events in NationBuilder can be found [here](https://support.nationbuilder.com/en/articles/2319673-setting-up-an-event#ticketed-events)
  - name: Events
    x-tag-expanded: false
    description: Resource used for managing event data associated with event pages. More details on events within NationBuilder can be found [here](https://support.nationbuilder.com/en/articles/2319673-setting-up-an-event)
  - name: Imports
    x-tag-expanded: false
    description: All kinds of data can be imported into a nation, when this happens we create an import resource as a record of the imported data. Each import has a type attribute defining the kind of data being imported. Find more information on imports and import types [here](https://support.nationbuilder.com/en/articles/2309526-types-of-imports). This version of the imports API does not currently support creating or archiving imports. Please use the v1 Imports API for this functionality [here](https://nationbuilder.com/imports_api).
  - name: Lists
    x-tag-expanded: false
    description: Lists are collections of signups. Often created from filters they are useful for grouping signups together by common attributes. They can be used to perform batch updates on signups or as a list of recipients for a mailing blast. Read more on what you can do with lists [here](https://support.nationbuilder.com/en/articles/2305947-create-a-list).
  - name: Mailings
    x-tag-expanded: false
    description: Referred to as email blasts, mailings send bulk emails to a group of signups at once. Mailings belong to and are sent via a broadcaster. The recipients of a mailing can be selected by lists, filters, or tags. Find more on how to use mailings [here](https://support.nationbuilder.com/en/articles/8077751-create-an-email-blast).
  - name: Membership Types
    x-tag-expanded: false
    description: Membership types are used to identify memberships assigned to signups. A membership type has many memberships which are assigned a single signup. The only required attribute for the membership type is a name, then signups can be given memberships with the newly created type. Read more on membership types [here](https://support.nationbuilder.com/en/articles/2362753-set-up-memberships#create-a-new-membership-type).
  - name: Memberships
    x-tag-expanded: false
    description: |
      A membership is a way to organize supporters and provide additional benefits based on actions they've taken or money donated.
      More information about memberships and the fields found in the UI and API interfaces can be found [here](https://support.nationbuilder.com/en/articles/2362753-set-up-memberships)

      By default, autoresponses when updating a membership are not triggered. Set the `trigger_autoresponses` param to `true` to trigger autoresponses on update.
  - name: Pages
    x-tag-expanded: false
    description: Pages are published on your site. Each page type offers different features, you can view them [here](https://support.nationbuilder.com/en/articles/2319593-types-of-nationbuilder-pages).
  - name: Path Histories
    x-tag-expanded: false
    description: Documents a signup's step along a path journey.
  - name: Path Journey Status Changes
    x-tag-expanded: false
    description: Documents the status change of a path journey.
  - name: Path Journeys
    x-tag-expanded: false
    description: Path journeys are the relationship between signups and paths. Further information available [here](https://support.nationbuilder.com/en/articles/3055899-create-paths#create-a-path).
  - name: Path Steps
    x-tag-expanded: false
    description: Path steps name the positions within a path a signup can be assigned to. Further information available [here](https://support.nationbuilder.com/en/articles/3055899-create-paths#add-steps-to-the-path)
  - name: Paths
    x-tag-expanded: false
    description: Paths store information about path journeys and steps. They are related to signups via path journeys. A path can be assigned many path journeys and path steps. Further information available [here](https://support.nationbuilder.com/en/articles/3055899-create-paths).
  - name: Petition Signatures
    x-tag-expanded: false
    description: Petition signatures are the relationship between petitions and signups.
  - name: Petitions
    x-tag-expanded: false
    description: Petitions are pages on your site that can be signed and shared by your supporters. Learn more about them [here](https://support.nationbuilder.com/en/articles/2327303-create-a-petition).
  - name: Pledges
    x-tag-expanded: false
    description: Pledges are a promise from a signup to donate to your cause. These are not donations. Further information available [here](https://support.nationbuilder.com/en/articles/2344197-fundraising-with-nationbuilder).
  - name: Precincts
    x-tag-expanded: false
    description: Precincts are districts used by political campaigns. Read more about them [here](https://support.nationbuilder.com/en/articles/2471652-creating-and-viewing-political-precincts).
  - name: Relationships
    x-tag-expanded: false
    description: Valid relationship types are ["affiliate-affiliate", "alum-school", "assistant-assisted", "board_member-organization", "candidate-committee", "chapter-parent", "child-parent", "consultant-organization", "employee-employer", "family_partner-family_partner", "friend-friend", "member-organization", "mentee-mentor", "partner-partner", "primary_contact-organization", "relative-relative", "representative-constituent", "resident-organization", "sibling-sibling", "spouse-spouse", "student-school", "student-teacher", "subordinate-manager", "subsidiary-parent", "treasurer-committee"]. first_signup_id corresponds with the ID of the signup on the first role listed, and second_signup_id corresponds with the ID of the signup on the second role listed in the relationship type."
  - name: Signup Profiles
    x-tag-expanded: false
    description: Profile information for a signup that can be displayed on a public site page. Read more on public profiles [here](https://support.nationbuilder.com/en/articles/2327657-how-public-profile-pages-work).
  - name: Signup Taggings
    x-tag-expanded: false
    description: Signup taggings are the relation between a signup and a tag.
  - name: Signup Tags
    x-tag-expanded: false
    description: Tags are used to quickly identify signups by certain characteristics. They are related to signups through SignupTaggings. Read more about them [here](https://support.nationbuilder.com/en/articles/2305680-how-to-use-tags).
  - name: Signups
    x-tag-expanded: false
    description: Signups store information about people in your nation. Further information available [here](https://support.nationbuilder.com/en/articles/8810042-how-records-are-added-to-the-people-database).
  - name: Sites
    x-tag-expanded: false
    description: A site is how supporters interact with your nation. Each site has a theme and many pages that can be drafted and published later to be viewed publicly. Read more about sites [here](https://support.nationbuilder.com/en/articles/2363313-set-up-your-website-for-success).
  - name: Suggestion Boxes
    x-tag-expanded: false
    description: |
      Suggestion boxes are containers for collecting suggestions from your community. They
      live on website pages, and define the settings, auto-responses, categorization tags,
      and moderation rules for suggestions.

      **Relationship:** Suggestions are created as child pages of SuggestionBoxes.
  - name: Suggestions
    x-tag-expanded: false
    description: |
      Suggestions are individual ideas or proposals submitted to suggestion boxes on your site.
      They can be responded to, categorized, and managed by administrators.

      **Responding to Suggestions:**
      Responses consist of optional text `official_response` and/or status via `response_type_id`. You can provide just text, just status, or both combined to officially respond to a suggestion.

      **Response Options:**
      - `official_response` - Text response (optional)
      - `response_type_id` - Status update (optional)
      - `response_author_id` - Signup ID of person that provided the response (optional)
      - `responded_at` - When the response was provided (optional)

      **Response Type IDs:
      - `0` - Not Planned
      - `1` - Considering
      - `2` - Planned
      - `3` - Started
      - `4` - Completed
      - `5` - Incomplete
      - `6` - Duplicate
      - `7` - Submitted (default)
  - name: Survey Question Possible Responses
    x-tag-expanded: false
    description: The potential answers to a survey question.
  - name: Survey Question Responses
    x-tag-expanded: false
    description: User responses to Survey Questions.
  - name: Survey Questions
    x-tag-expanded: false
    description: Questions asked within a survey.
  - name: Surveys
    x-tag-expanded: false
    description: Surveys have questions with possible responses. These questions also have responses from the users.
  - name: Voters
    x-tag-expanded: false
    description: Voter records store the ballot history of a single signup.
