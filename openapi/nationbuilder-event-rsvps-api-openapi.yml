      description: The attributes of a event_rsvp that can be both read and written.
      type: object
      properties:
        amount_in_cents:
          type:
          - integer
          - 'null'
          examples:
          - 350
          description: The cost of the RSVP in cents.
        attendee:
          type:
          - boolean
          - 'null'
          examples:
          - false
          description: The signup is attending the event.
        canceled:
          type:
          - boolean
