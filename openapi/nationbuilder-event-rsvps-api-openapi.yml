          - 'null'
          examples:
          - Lucille
          description: The attendee's first name.
        guests_count:
          type:
          - integer
          - 'null'
          examples:
          - 19
          description: Number of guests on the RSVP.
        last_name:
          type:
          - string
          - 'null'
          examples:
          - Ball
          description: The attendee's last name.
        page_id:
          type:
          - string
          - 'null'
          examples:
          - '1'
          description: The associated page.
        prepaid:
