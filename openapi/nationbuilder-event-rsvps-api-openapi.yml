            distance: 0
            import_id: '2'
            work_phone: '5555555555'
            phone_number: '5555555555'
            phone_country_code: '1'
            work_phone_number: '5555555555'
          description: "        Attribute used to write data to the given event_rsvp's Billing address.\n        When an address already exists, provided values will be used to patch the existing address data,\n        only overwriting values provided in the payload.\n        When no address exists, the existing data will be used to persist a new address.\n"
