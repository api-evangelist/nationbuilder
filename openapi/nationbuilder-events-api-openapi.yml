          type:
          - string
          - 'null'
          examples:
          - USD
          description: Currency tickets are purchased in. Used only when selling tickets outside of NationBuilder
        user_ticket_price_in_cents:
          type:
          - integer
          - 'null'
          examples:
          - 400
          description: Price in cents of the ticket level. Used only when selling tickets outside of NationBuilder
        user_ticket_purchase_url:
          type:
          - string
          - 'null'
          examples:
          - https://www.example.com
          description: URL to third-party seller where tickets are being sold. Used only when selling tickets outside of NationBuilder
        uses_shifts:
          type:
          - boolean
          - 'null'
          examples:
          - false
          description: Flag controlling whether RSVPs will be asked to sign up for shifts during the event.
        uses_tickets:
          type:
          - boolean
          - 'null'
          examples:
          - false
          description: Flag controller whether tickets will be sold to people RSVPing to the event
        venue_name:
          type:
          - string
          - 'null'
          examples:
          - Event Center
          description: Name of the venue
    event_show_response:
      description: A JSON:API response containing a single event.
      allOf:
      - $ref: '#/components/schemas/show_document'
      - type: object
        properties:
          data:
            $ref: '#/components/schemas/event_response_data'
    pagination_links:
      description: JSON:API pagination links for the pages of a collection. A key whose page is unavailable, or that the server's pagination strategy does not provide, is omitted or null.
      type: object
      properties:
        self:
          type: string
          description: Link to the current page.
          examples:
          - /articles?page[number]=2
        first:
          type:
          - string
          - 'null'
          description: Link to the first page.
          examples:
          - /articles?page[number]=1
        last:
          type:
          - string
          - 'null'
          description: Link to the last page.
          examples:
          - /articles?page[number]=5
        prev:
          type:
          - string
          - 'null'
          description: Link to the previous page.
          examples:
          - /articles?page[number]=1
        next:
          type:
          - string
          - 'null'
          description: Link to the next page.
          examples:
          - /articles?page[number]=3
    index_document:
      description: The JSON:API top-level document shape for paginated collection responses, with resource objects under data and pagination links.
      type: object
      required:
      - data
      properties:
        data:
          type: array
          description: The page of resource objects for this collection; each resource binds its concrete item schema here via allOf composition.
        links:
          $ref: '#/components/schemas/pagination_links'
        included:
          $ref: '#/components/schemas/included'
        meta:
          type: object
          description: Non-standard information about the document, such as requested statistics. Empty unless the endpoint has metadata to convey.
    validation_error:
      description: A single JSON:API error object describing a validation failure, locating the invalid field via source.pointer and carrying the model-level attribute, message, and code under meta.
      type: object
      properties:
        code:
          type: string
          description: Machine-readable error code.
          examples:
          - unprocessable_entity
        status:
          type: string
          description: The HTTP status code, as a string.
          examples:
          - '422'
        title:
          type: string
          description: Short human-readable summary of the error type.
          examples:
          - Validation Error
        detail:
          type: string
          description: Human-readable explanation specific to this failure.
          examples:
          - Email 'not-an-email' should look like an email address
        source:
          type: object
          properties:
            pointer:
              type: string
              description: JSON Pointer to the request document member the error relates to.
              examples:
              - /data/attributes/email
        meta:
          type: object
          description: The underlying model validation error, including the attribute name, message, and code. Errors on sideposted resources nest these members under a relationship key.
          properties:
            attribute:
              type: string
              description: The attribute that failed validation.
            message:
              type: string
              description: The validation failure message.
            code:
              type: string
              description: The validation failure code.
    event_response_data:
      description: The JSON:API resource object representing a event.
      allOf:
      - $ref: '#/components/schemas/resource_identifier'
      - type: object
        properties:
          type:
            const: events
            examples:
            - events
          attributes:
            allOf:
            - $ref: '#/components/schemas/event_read_write_attributes'
            - $ref: '#/components/schemas/event_read_only_attributes'
    event_field_values:
      description: Readable event attribute names selectable with sparse fieldsets (fields[events]).
      type: string
      enum:
      - accept_rsvps
      - additional_rsvps_count
      - allow_guests
      - attending_count
      - auto_response_broadcaster_id
      - auto_response_content
      - auto_response_subject
      - capacity_count
      - contact_email
      - contact_email_private
      - contact_name
      - contact_phone_number
      - contact_phone_private
      - content
      - donation_tracking_code_id
      - duration
      - event_form_address
      - event_form_phone
      - gather_volunteers
      - page_id
      - point_person_id
      - private
      - sends_auto_response
      - show_guests
      - start_at
      - time_zone
      - user_ticket_currency
      - user_ticket_price_in_cents
      - user_ticket_purchase_url
      - uses_shifts
      - uses_tickets
      - venue_name
    delete_document:
      examples:
      - meta: {}
      description: The successful destroy response, an empty JSON:API meta-only document returned with status 200 (rather than JSON:API's commonly used 204 No Content).
      type: object
      required:
      - meta
      additionalProperties: false
      properties:
        meta:
          examples:
          - {}
          type: object
          properties: {}
    rate_limited_response:
      description: The body returned by the rate limiter when an access token exceeds its request quota.
      type: object
      required:
      - message
      properties:
        message:
          type: string
          description: Human-readable explanation of the rate limit.
          examples:
          - You have made too many requests. Please try again later.
    event_create_request:
      description: The request body for creating a new event.
      allOf:
      - $ref: '#/components/schemas/create_request_document'
      - type: object
        properties:
          data:
            type: object
            properties:
              type:
                const: events
                examples:
                - events
              attributes:
                allOf:
                - $ref: '#/components/schemas/event_read_write_attributes'
                - $ref: '#/components/schemas/event_write_only_attributes'
              relationships:
                type: object
                properties:
                  page:
                    type: object
                    properties:
                      data:
                        allOf:
                        - $ref: '#/components/schemas/sidepost_relationship_data'
                        - type: object
                          properties:
                            type:
                              const: pages
                              examples:
                              - pages
          included:
            examples:
            - - type: pages
                temp-id: new-id
                attributes:
                  site_id: '1'
                  parent_id: '1'
                  author_id: '1'
                  external_id: abc
                  slug: your-slug
                  status: unlisted
                  name: Page Name
                  headline: Page headline
                  title: Page Title
                  excerpt: Page excerpt...
                  page_type_name: Event
                  permission_level: anyone
            type: array
            items:
              type: object
              properties:
                type:
                  type: string
                  const: pages
                  examples:
                  - pages
                temp-id:
                  type: string
                  examples:
                  - new-id
                attributes:
                  allOf:
                  - $ref: '#/components/schemas/page_sidepost_attributes'
                  - type: object
                    properties:
                      page_type_name:
                        type: string
                        examples:
                        - Event
                        description: Must be 'Event' for this endpoint.
                        enum:
                        - Event
    event_index_response:
      description: A paginated JSON:API response containing a list of events.
      allOf:
      - $ref: '#/components/schemas/index_document'
      - type: object
        properties:
          data:
            type: array
            items:
              $ref: '#/components/schemas/event_response_data'
    validation_error_document:
      description: The JSON:API errors document returned with status 422 when model validations fail on create or update. Unlike this API's flat 4xx error bodies, validation failures follow the JSON:API errors format.
      type: object
      required:
      - errors
      properties:
        errors:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/validation_error'
    update_request_document:
      description: The JSON:API top-level document shape for update requests, whose data member identifies the resource by type and id and carries the changed attributes.
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - type
          - id
          properties:
            id:
              type: string
              description: The ID of the resource being updated.
            type:
              type: string
              description: The JSON:API resource type of the resource being updated.
    create_request_document:
      description: The JSON:API top-level document shape for create requests, whose data member carries the new resource's type and attributes.
      type: object
      required:
      - data
      properties:
        data:
          type: object
          required:
          - type
          properties:
            type:
              type: string
              description: The JSON:API resource type of the resource being created.
    event_write_only_attributes:
      description: The write-only attributes of a event.
      type: object
      properties:
        venue_address_attributes:
          type:
          - object
          - 'null'
          examples:
          - address1: 20 W 34th St.
            address2: Suite 100
            address3: null
            city: New York
            state: NY
            zip: '10001'
            county: New York County
            country_code: US
            lat: '40.7484'
            lng: '73.9857'
            fips: '04'
            submitted_address: 20 W 34th St. Suite 100, New York, NY 10001
            distance: 0
            import_id: '2'
            work_phone: '5555555555'
            phone_number: '5555555555'
            phone_country_code: '1'
            work_phone_number: '5555555555'
            delete: true
          description: "        Attribute used to write data to the given event's Venue address.\n        When an address already exists, provided values will be used to patch the existing address data,\n        only overwriting values provided in the payload.\n        When no address exists, the existing data will be used to persist a new address.\n"
    event_update_request:
      description: The request body for updating an existing event.
      allOf:
      - $ref: '#/components/schemas/update_request_document'
      - type: object
        properties:
          data:
            type: object
            properties:
              id:
                type: string
                examples:
                - '1'
              type:
                const: events
                examples:
                - events
              attributes:
                allOf:
                - $ref: '#/components/schemas/event_read_write_attributes'
                - $ref: '#/components/schemas/event_write_only_attributes'
    resource:
      description: A generic JSON:API resource object. Resources sideloaded in a document's included member use this shape; their attributes are those of the resource type named in the type member.
      allOf:
      - $ref: '#/components/schemas/resource_identifier'
      - type: object
        properties:
          attributes:
            type: object
            description: The attributes of the resource, as documented for its resource type.
          relationships:
            type: object
            description: References from this resource to other resources in the document.
    included:
      description: Sideloaded resources requested via the include query parameter. Each entry is a full resource object whose shape is documented under its own resource type.
      type: array
      items:
        $ref: '#/components/schemas/resource'
  parameters:
    event_extra_fields:
      name: extra_fields[events]
      in: query
      description: Comma-delimited list of extra event attributes, which are only returned in the response if requested.
      required: false
      schema:
        type: array
        default: []
        uniqueItems: true
        items:
          $ref: '#/components/schemas/event_extra_field_values'
      style: form
      explode: false
    pagination_size:
      name: page[size]
      description: 'Number of results to display per page (default: 20, max: 100, min: 1)'
      in: query
      required: false
      schema:
        type: string
        default: '20'
    event_sparse_fields:
      name: fields[events]
      in: query
      required: false
      description: Comma-delimited list of event attributes to only return in the response
      schema:
        type: array
        default: []
        uniqueItems: true
        items:
          $ref: '#/components/schemas/event_field_values'
      style: form
      explode: false
    id:
      name: id
      in: path
      description: id
      required: true
      schema:
        type: string
    event_index_include:
      name: include
      in: query
      description: 'Comma-delimited list of sideloaded resources to include as part of the event index response.

        See guidance [here](https://support.nationbuilder.com/en/articles/9899245-api-v2-walkthrough#h_2d5333adab) about

        sideloading large numbers of resources and pagination.

        '
      schema:
        type: array
        default: []
        uniqueItems: true
        items:
          $ref: '#/components/schemas/event_sideload_values'
      required: false
      style: form
      explode: false
    event_show_include:
      name: include
      in: query
      description: 'Comma-delimited list of sideloaded resources to include as part of the event response.

        See guidance [here](https://support.nationbuilder.com/en/articles/9899245-api-v2-walkthrough#h_2d5333adab) about

        sideloading large numbers of resources and pagination.

        '
      schema:
        type: array
        default: []
        uniqueItems: true
        items:
          $ref: '#/components/schemas/event_sideload_values'
      required: false
      style: form
      explode: false
    pagination_number:
      name: page[number]
      description: Page number to list (starting at 1)
      in: query
      required: false
      schema:
        type: string
        default: '1'
  requestBodies:
    event_update_request_body:
      description: The attributes to update on the existing event.
      content:
        application/vnd.api+json:
          schema:
            $ref: '#/components/schemas/event_update_request'
        application/json:
          schema:
            $ref: '#/components/schemas/event_update_request'
  headers:
    RateLimit-Remaining:
      description: Number of requests remaining for the current access token in the current rate-limit window.
      schema:
        type: string
        examples:
        - '249'
      examples: {}
    Retry-After:
      description: Number of seconds to wait before retrying. Sent with 429 responses.
      schema:
        type: string
        examples:
        - '10'
      examples: {}
    RateLimit-Limit:
      description: Maximum number of requests allowed for the current access token per rate-limit window (10 seconds).
      schema:
        type: string
        examples:
        - '250'
      examples: {}
    RateLimit-Reset:
      description: Unix timestamp (in seconds) at which the current rate-limit window resets.
      schema:
        type: string
        examples:
        - '1719964810'
      examples: {}
  responses:
    bad_request:
      description: The request body or query parameters are invalid, such as an unknown attribute, filter, filter operator, sort field, or sideload.
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/json:
          example:
            code: bad_request
            message: Tried to filter on attribute :bogus, but could not find an attribute with that name.
          schema:
            $ref: '#/components/schemas/error_response'
    unauthorized:
      description: The access token is missing, expired, or not authorized to access this resource.
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/json:
          example:
            code: unauthorized
            message: You are not authorized to access this content. Your access token may be missing. The resource owner also may not have a permission level sufficient to grant access.
          schema:
            $ref: '#/components/schemas/error_response'
    unprocessable:
      description: Model validations failed for the resource being created or updated. Unlike this API's other errors, validation failures are returned as a JSON:API errors document locating each invalid field.
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/vnd.api+json:
          example:
            errors:
            - code: unprocessable_entity
              status: '422'
              title: Validation Error
              detail: Email 'not-an-email' should look like an email address
              source:
                pointer: /data/attributes/email
              meta:
                attribute: email
                message: '''not-an-email'' should look like an email address'
          schema:
            $ref: '#/components/schemas/validation_error_document'
    rate_limited:
      description: The access token has exceeded its request quota for the current rate-limit window.
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
        Retry-After:
          $ref: '#/components/headers/Retry-After'
      content:
        application/json:
          example:
            message: You have made too many requests. Please try again later.
          schema:
            $ref: '#/components/schemas/rate_limited_response'
    not_found:
      description: No resource exists with the provided ID.
      headers:
        RateLimit-Limit:
          $ref: '#/components/headers/RateLimit-Limit'
        RateLimit-Remaining:
          $ref: '#/components/headers/RateLimit-Remaining'
        RateLimit-Reset:
          $ref: '#/components/headers/RateLimit-Reset'
      content:
        application/json:
          example:
            code: not_found
            message: Record not found
          schema:
            $ref: '#/components/schemas/error_response'
  securitySchemes:
    BearerAuth:
      description: Authentication using a bearer token (JWT) issued via OAuth.
      type: http
      scheme: bearer
      bearerFormat: JWT
externalDocs:
  description: Get started with the NationBuilder API
  url: https://nationbuilder.com/api_quickstart
